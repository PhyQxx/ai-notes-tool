spring:
  # Database Configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ai_notes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 5

# FTP Production Configuration
ftp:
  host: ${FTP_HOST:127.0.0.1}
  port: ${FTP_PORT:21}
  username: ${FTP_USERNAME:anonymous}
  password: ${FTP_PASSWORD:}
  base-path: ${FTP_PATH:/}
  url-prefix: ${FTP_URL_PREFIX:http://127.0.0.1}

# JWT Production Configuration
jwt:
  secret: ${JWT_SECRET:ai-notes-prod-secret-key-2024-at-least-32chars}
  expiration: 86400000

# AI Configuration
ai:
  rag:
    enabled: true

# Logging Production Configuration
logging:
  level:
    com.ainotes: info
    com.baomidou.mybatisplus: info
  file:
    name: /var/log/ai-notes/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
