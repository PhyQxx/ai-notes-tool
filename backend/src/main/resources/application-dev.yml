spring:
  # Database Configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_notes?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8}
    username: root
    password: 123456

  # Redis Configuration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

# MinIO Development Configuration
minio:
  endpoint: http://127.0.0.1:9010
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: ai-notes-dev

# JWT Development Configuration
jwt:
  secret: ai-notes-dev-secret-key-2024-at-least-32chars
  expiration: 7200000  # 2小时

# AI Configuration
ai:
  rag:
    enabled: false
  deepseek:
    api-key:
  glm:
    api-key:

# Logging Development Configuration
logging:
  level:
    com.ainotes: debug
    org.springframework.web: debug
    com.baomidou.mybatisplus: debug
